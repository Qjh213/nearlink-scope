name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: 串口接收单测
        run: python -m unittest discover -s tests -v
      - name: 分析工具单测
        run: python tools/test_nlscope.py -v
      - name: 固件主机侧测试
        shell: pwsh
        run: pwsh -NoProfile -File firmware/linkscope/test/run_host_test.ps1
